name: Daily Wind Data Update

on:
  schedule:
    # Trigger daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-wind:
    name: Fetch Latest Global Wind Vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.KMD_BOT_APP_ID }}
          private-key: ${{ secrets.KMD_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and compile global wind field
        id: fetch-wind
        run: node scripts/fetch-current-wind.mjs

      - name: Create Pull Request with updated wind vectors
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): refresh global wind vectors (${{ steps.fetch-wind.outputs.date_range || 'daily' }})"
          title: "chore(data): refresh global wind vectors (${{ steps.fetch-wind.outputs.date_range || 'daily' }})"
          body: |
            Automated daily refresh of global meteorological wind vectors (`src/assets/data/current-wind.json`) from Open-Meteo.

            - **Telemetry Window:** ${{ steps.fetch-wind.outputs.date_range || 'Latest 24h cycle' }}
            - **Valid Grid Nodes:** ${{ steps.fetch-wind.outputs.valid_nodes || '468' }}
            - **Peak Wind Speed:** ${{ steps.fetch-wind.outputs.max_speed || 'N/A' }}
          branch: chore/daily-wind-update
          delete-branch: true

      - name: Auto-merge Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --admin --squash --delete-branch || \
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --squash --delete-branch
