name: Daily Wind Data Update

on:
  schedule:
    # Trigger daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-wind:
    name: Fetch Latest Global Wind Vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and compile global wind field
        run: node scripts/fetch-current-wind.mjs

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/data/current-wind.json
          if git diff --staged --quiet; then
            echo "No wind data updates to commit."
          else
            git commit -m "chore(data): refresh global wind vectors [skip ci]"
            git push
          fi
