<div
  class="carousel"
  [style.--slide-width]="slideWidth()"
  [style.--slide-gap]="slideGap()"
  (pointerenter)="setPaused(true)"
  (pointerleave)="setPaused(false)"
  (focusin)="setPaused(true)"
  (focusout)="setPaused(false)">

  <!-- Carousel Controls Toolbar (Nav buttons + Pill tabs) -->
  <div
    class="carousel__controls"
    role="toolbar"
    *ngIf="pills().length > 0 || ariaLabel()"
    [attr.aria-label]="ariaLabel()">
    <button
      type="button"
      class="carousel__nav-btn"
      [attr.aria-label]="prevAria()"
      (click)="prev()">
      <lucide-icon [img]="chevronLeftIcon" [size]="16" aria-hidden="true"></lucide-icon>
    </button>

    <div class="carousel__pills" role="tablist" *ngIf="pills().length > 0">
      <button
        *ngFor="let pill of pills(); let i = index"
        type="button"
        role="tab"
        class="carousel__pill"
        [class.is-active]="activeRealIndex() === i"
        [attr.aria-selected]="activeRealIndex() === i"
        [attr.aria-label]="pill.ariaLabel || pill.label"
        (click)="select(i)">
        <img
          *ngIf="pill.avatar"
          class="carousel__pill-avatar"
          [src]="pill.avatar"
          alt=""
          width="22"
          height="22" />
        <span class="carousel__pill-name font-mono">{{ pill.label }}</span>
        <span
          class="carousel__pill-progress"
          *ngIf="activeRealIndex() === i && autoPlayMs() > 0"
          [style.animationDuration.ms]="autoPlayMs()"
          [class.is-paused]="isPaused()"></span>
      </button>
    </div>

    <button
      type="button"
      class="carousel__nav-btn"
      [attr.aria-label]="nextAria()"
      (click)="next()">
      <lucide-icon [img]="chevronRightIcon" [size]="16" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  <!-- Fade-to-0% Opacity Mask Viewport -->
  <div
    class="carousel__viewport"
    [class.is-dragging]="isDragging()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel($event)"
    (dragstart)="$event.preventDefault()">
    <div
      class="carousel__track"
      [class.is-animating]="transitionEnabled()"
      [style.transform]="'translateX(calc(-1 * ' + trackIndex() + ' * (var(--slide-width) + var(--slide-gap)) + ' + dragOffsetPx() + 'px))'"
      (transitionend)="onTrackTransitionEnd($event)">
      <div
        *ngFor="let slide of slides(); let sIdx = index; trackBy: trackSlideById"
        class="carousel__slide-wrap"
        [class.is-active]="trackIndex() === sIdx"
        [class.is-peeking]="trackIndex() !== sIdx"
        [attr.aria-hidden]="trackIndex() !== sIdx"
        [attr.inert]="trackIndex() !== sIdx ? '' : null"
        (click)="onSlideClick(sIdx)">
        <ng-container
          *ngTemplateOutlet="slideTemplate; context: {
            $implicit: slide.item,
            index: slide.realIndex,
            isActive: trackIndex() === sIdx,
            isPeeking: trackIndex() !== sIdx,
            isClone: slide.isClone,
            hasDragged: hasDragged
          }">
        </ng-container>
      </div>
    </div>
  </div>
</div>
